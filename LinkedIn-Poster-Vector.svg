<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Glassmorphism Shaders -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#glowCyan)"/>
  <rect width="1920" height="1080" fill="url(#glowPurple)"/>
  <rect width="1920" height="1080" fill="url(#glowGreen)"/>

  <!-- Subtle High-Tech Grid Matrix -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
    <line x1="160" y1="0" x2="160" y2="1080"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1120" y1="0" x2="1120" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
    <line x1="1760" y1="0" x2="1760" y2="1080"/>
  </g>

  <!-- Top Pill Badges -->
  <g transform="translate(670, 70)">
    <rect x="0" y="0" width="260" height="44" rx="22" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#dropGlow)"/>
    <circle cx="28" cy="22" r="7" fill="#10b981" filter="url(#neonPulse)"/>
    <text x="48" y="28" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" letter-spacing="1.5">24/7 CLOUD ACTIVE</text>
  </g>
  <g transform="translate(970, 70)">
    <rect x="0" y="0" width="280" height="44" rx="22" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#dropGlow)"/>
    <circle cx="28" cy="22" r="7" fill="#06b6d4"/>
    <text x="48" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" letter-spacing="1.5">AUTONOMOUS DISPATCH</text>
  </g>

  <!-- Headline & Subtitle -->
  <text x="960" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">
    I BUILT AN AUTONOMOUS AI JOB HUNTER
  </text>
  <text x="960" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Listens to WhatsApp Groups &amp; Channels 24/7 • Analyzes Requirements • Auto-Applies with CV &amp; Portfolio
  </text>

  <!-- Main Pipeline Glassmorphism Board -->
  <g transform="translate(180, 310)" filter="url(#dropGlow)">
    <rect width="1560" height="570" rx="32" fill="url(#glassBg)" stroke="url(#glassBorder)" stroke-width="2"/>

    <!-- Left Column: Step 1 (Incoming Job Feeds) -->
    <g transform="translate(60, 50)">
      <rect width="400" height="470" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <rect x="25" y="25" width="56" height="56" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <text x="53" y="61" text-anchor="middle" font-size="28">💬</text>
      
      <text x="95" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981" letter-spacing="1.5">STEP 01 • INGESTION</text>
      <text x="95" y="74" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">WhatsApp Radar</text>

      <!-- Feeds list -->
