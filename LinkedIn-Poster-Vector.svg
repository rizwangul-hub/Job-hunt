        <rect width="350" height="70" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155"/>
        <circle cx="30" cy="35" r="14" fill="#25D366" fill-opacity="0.2"/>
        <text x="30" y="40" text-anchor="middle" font-size="14">📢</text>
        <text x="58" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">WhatsApp Broadcast Channels</text>
        <text x="58" y="50" font-family="sans-serif" font-size="12" fill="#94a3b8">Tech Jobs Radar &amp; IT Communities</text>
      </g>
      <g transform="translate(25, 195)">
        <rect width="350" height="70" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155"/>
        <circle cx="30" cy="35" r="14" fill="#06b6d4" fill-opacity="0.2"/>
        <text x="30" y="40" text-anchor="middle" font-size="14">👥</text>
        <text x="58" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">WhatsApp Job Groups</text>
        <text x="58" y="50" font-family="sans-serif" font-size="12" fill="#94a3b8">Real-time developer hiring posts</text>
