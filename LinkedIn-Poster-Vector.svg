      <g transform="translate(200, 205)">
        <circle cx="0" cy="0" r="75" fill="#1e293b" stroke="#334155" stroke-width="10"/>
        <circle cx="0" cy="0" r="75" fill="none" stroke="#10b981" stroke-width="10" stroke-dasharray="471" stroke-dashoffset="30" filter="url(#neonPulse)"/>
        <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="900" fill="#ffffff">100%</text>
        <text x="0" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">MATCH SCORE</text>
      </g>

      <!-- Skills detected badge tags -->
      <g transform="translate(35, 315)">
        <rect x="0" y="0" width="100" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="50" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">MERN Stack</text>

        <rect x="115" y="0" width="95" height="32" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
        <text x="162" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">React / Node</text>

        <rect x="225" y="0" width="105" height="32" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
        <text x="277" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a78bfa">Python / C++</text>

        <rect x="0" y="44" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="80" y="65" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1">AI &amp; Data Analysis</text>

        <rect x="175" y="44" width="155" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="252" y="65" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1">Data Entry / Office</text>
      </g>
      <text x="200" y="435" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">✨ Dynamic Role-Tailored Pitch</text>
    </g>

    <!-- Center Arrow 2 -->
    <g transform="translate(1005, 270)">
      <circle cx="35" cy="0" r="28" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="35" y="8" text-anchor="middle" font-size="22" fill="#10b981">→</text>
    </g>

    <!-- Right Column: Step 3 (Instant Multi-Channel Dispatch) -->
    <g transform="translate(1100, 50)">
      <rect width="400" height="470" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <rect x="25" y="25" width="56" height="56" rx="16" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="53" y="61" text-anchor="middle" font-size="28">🚀</text>
      
      <text x="95" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8b5cf6" letter-spacing="1.5">STEP 03 • ACTION</text>
      <text x="95" y="74" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Instant Outreach</text>

