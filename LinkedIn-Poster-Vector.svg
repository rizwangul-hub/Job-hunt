  <!-- Bottom Developer Signature Bar -->
  <g transform="translate(460, 940)">
    <rect width="1000" height="70" rx="20" fill="#0b1329" stroke="#334155" stroke-width="1.5" filter="url(#dropGlow)"/>
    
    <text x="50" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Developer: Rizwan Ullah</text>
    <circle cx="270" cy="37" r="4" fill="#64748b"/>
    <text x="290" y="42" font-family="sans-serif" font-size="15" fill="#38bdf8">🌐 full-stack-portfolio-coral.vercel.app</text>
    <circle cx="680" cy="37" r="4" fill="#64748b"/>
    <text x="700" y="42" font-family="sans-serif" font-size="15" fill="#34d399">💻 github.com/rizwangul-hub</text>
