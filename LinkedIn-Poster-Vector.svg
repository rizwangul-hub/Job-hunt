      <g transform="translate(25, 110)">
        <rect width="350" height="70" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#10b981"/>
        <circle cx="30" cy="35" r="14" fill="#10b981" fill-opacity="0.2"/>
        <text x="30" y="40" text-anchor="middle" font-size="14">📧</text>
        <text x="58" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Direct Email Dispatch</text>
        <text x="58" y="50" font-family="sans-serif" font-size="12" fill="#34d399">CV PDF attached + Tailored Cover Letter</text>
      </g>
      <g transform="translate(25, 195)">
        <rect width="350" height="70" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#25D366"/>
        <circle cx="30" cy="35" r="14" fill="#25D366" fill-opacity="0.2"/>
        <text x="30" y="40" text-anchor="middle" font-size="14">💬</text>
        <text x="58" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">WhatsApp Recruiter DM</text>
        <text x="58" y="50" font-family="sans-serif" font-size="12" fill="#34d399">Resume PDF + Direct Introduction</text>
      </g>
      <g transform="translate(25, 280)">
        <rect width="350" height="70" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#06b6d4"/>
        <circle cx="30" cy="35" r="14" fill="#06b6d4" fill-opacity="0.2"/>
        <text x="30" y="40" text-anchor="middle" font-size="14">🔗</text>
        <text x="58" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Interactive Tech Portfolio</text>
        <text x="58" y="50" font-family="sans-serif" font-size="12" fill="#38bdf8">GitHub • LinkedIn • Live Web Demos</text>
