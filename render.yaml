services:
  - type: web
    name: rizagent-job-hunter
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: CANDIDATE_NAME
        value: Rizwan Ullah
      - key: CANDIDATE_PHONE
        value: "+92 325 5984244"
      - key: CANDIDATE_PORTFOLIO
        value: https://full-stack-portfolio-coral.vercel.app
      - key: CANDIDATE_LINKEDIN
        value: https://www.linkedin.com/in/rizwanmerndev
      - key: CANDIDATE_GITHUB
        value: https://github.com/rizwangul-hub
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: LINKEDIN_LI_AT
        sync: false
